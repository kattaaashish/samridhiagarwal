# Builds and deploys to Cloudflare Workers on every push to main, and whenever Sanity
# publishes content (Sanity webhook → GitHub repository_dispatch, event type "sanity-publish").
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (placeholder media, only used when a slot has no CMS media)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm media:gen
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://samridhiagarwal.com
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
          PUBLIC_STREAM_CUSTOMER_CODE: ${{ vars.PUBLIC_STREAM_CUSTOMER_CODE }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
